<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de decolagem · AeroDesign</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/", "lil-gui": "/vendor/lil-gui/lil-gui.esm.min.js" } }</script>
<style>
  :root { color-scheme: dark; --bg: #101216; --panel: #181b21; --line: #2a2f38; --text: #e8eaed; --muted: #9aa3ae; --ok: #3ce66e; --bad: #ff5a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; gap: 1px; background: var(--line); }
  header { grid-column: 1 / -1; background: var(--panel); padding: 8px 14px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .stat { color: var(--muted); font-variant-numeric: tabular-nums; }
  header .stat b { color: var(--text); font-weight: 600; }
  #verdict { font-weight: 700; }
  #main { position: relative; background: #000; min-height: 0; }
  #main canvas { width: 100%; height: 100%; object-fit: contain; display: block; cursor: grab; }
  #mainLabel { position: absolute; left: 10px; top: 8px; background: #000a; padding: 2px 8px; border-radius: 4px; pointer-events: none; }
  #side { background: var(--panel); overflow-y: auto; min-height: 0; }
  #side .lil-gui { --width: 100%; position: static; }
  #strip { grid-column: 1 / -1; background: var(--panel); display: flex; gap: 8px; padding: 8px; overflow-x: auto; }
  .thumb { position: relative; flex: 0 0 auto; border: 2px solid transparent; border-radius: 4px; cursor: pointer; line-height: 0; }
  .thumb.sel { border-color: #5aa0ff; }
  .thumb canvas { height: 150px; width: auto; border-radius: 2px; }
  .thumb span { position: absolute; left: 6px; top: 4px; line-height: 1.3; font-size: 12px; background: #000a; padding: 1px 6px; border-radius: 3px; }
  #busy { position: absolute; inset: 0; display: none; place-items: center; background: #000a; font-size: 16px; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 50vh auto auto; height: auto; } #strip { grid-row: 3; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Simulador de decolagem · AeroDesign</h1>
    <span class="stat">t <b id="sT">0.00</b> s</span>
    <span class="stat">x <b id="sX">0.0</b> m</span>
    <span class="stat">V <b id="sV">0.0</b> m/s</span>
    <span class="stat">massa <b id="sM">—</b> kg · V<sub>estol</sub> <b id="sVs">—</b> m/s</span>
    <span class="stat">folga real <b id="sC">—</b> <span id="verdict"></span></span>
    <span class="stat" style="margin-left:auto"><b id="sFps">—</b> fps · <span id="sGpu"></span></span>
  </header>
  <div id="main"><canvas id="view"></canvas><div id="mainLabel">visão livre (arraste para orbitar)</div><div id="busy">recalculando…</div></div>
  <div id="side"></div>
  <div id="strip"></div>
</div>
<canvas id="gl" style="display:none"></canvas>
<script type="module" src="/main.js"></script>
</body>
</html>
