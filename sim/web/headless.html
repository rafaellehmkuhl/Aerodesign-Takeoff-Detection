<!doctype html>
<html><head><meta charset="utf-8"><title>headless</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head><body style="margin:0;background:#000"><canvas id="c"></canvas>
<script type="module">
import { createSim } from '/src/sim.js';
const cfg = await (await fetch('/api/config' + location.search)).json();
const canvas = document.getElementById('c');
const sim = await createSim(cfg, { canvas });
window.sim = sim;
// Renderiza um quadro e devolve o JPEG em base64.
window.renderFrame = async (name, t, idx, quality) => {
  sim.render(name, t, idx);
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality ?? 0.93));
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
};
window.ready = true;
</script></body></html>
